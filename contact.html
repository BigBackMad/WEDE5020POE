<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Contact | Little Woods Books</title>
    <link rel="stylesheet" href="style/style.css">
</head>

<body>

    <header>
        <nav>
            <ul>
              <li><a href="index.html">Home</a></li>
               <li><a href="catalogue.html">Catalogue</a></li>
               <li><a href="bundles.html">Gift Bundles</a></li>
                <li><a href="blog.html">Blog/Reviews</a></li>
               <li><a href="about.html">About Us</a></li>
               <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <!-- 1. Direct Contact Details -->
        <section id="contact-info">
            <h2>Get in Touch</h2>
            <address>
                <strong>Little Woods Books</strong><br>
                14 Hollowbrook Lane, Gardens<br>
                Cape Town, 8001<br><br>
                <strong>Email:</strong> <a href="mailto:hello@littlewoodsbooks.co.za">hello@littlewoodsbooks.co.za</a><br>
                <strong>Phone:</strong> 021 555 0123
            </address>
        </section>

        <!-- 2. Simple Reservation / Contact Form -->
        <section id="contact-form">
            <form action="#" method="post">
                <fieldset>
                    <legend>Reserve a Book or Send a Query</legend>
                    
                    <p>
                        <label for="user-name">Your Name:</label>
                        <input type="text" id="user-name" name="name" required>
                    </p>
                    
                    <p>
                        <label for="user-email">Email Address:</label>
                        <input type="email" id="user-email" name="email" required>
                    </p>
                    
                    <p>
                        <label for="subject">Subject:</label>
                        <select id="subject" name="subject">
                            <option value="general">General Inquiry</option>
                            <option value="reservation">Book Reservation</option>
                            <option value="donation">Book Donation</option>
                        </select>
                    </p>
                    
                    <p>
                        <label for="message">Message:</label>
                        <textarea id="message" name="message" rows="5" placeholder="Tell us which book you are looking for..."></textarea>
                    </p>
                    
                    <button type="submit">Submit Query</button>
                </fieldset>
            </form>
        </section>

    </main>

    <footer>
        <p> &copy; 2026 Little Woods Books. All rights reserved.</p>
    </footer>

</body>
</html>
